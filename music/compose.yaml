services:
  music-assistant:
    image: ghcr.io/music-assistant/server:2.10.13
    container_name: music-assistant
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/data
    environment:
      LOG_LEVEL: info
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
